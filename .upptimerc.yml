# Uptime monitor and status page for heeey.click (SOC 2 control C17).
# Every 5 minutes GitHub Actions checks each site below; an outage opens an issue here
# automatically and closes it on recovery. The page is served by GitHub Pages.
owner: carloseorsantos
repo: status

sites:
  - name: Website
    url: https://www.heeey.click
  - name: App and database
    # Checks Supabase Auth, Storage and Postgres; answers 503 when any of them fails
    url: https://www.heeey.click/api/health
  - name: REST API
    url: https://www.heeey.click/api/v1
  - name: MCP server
    # The endpoint only accepts POST, so a 405 to this GET means it is up
    url: https://www.heeey.click/api/mcp
    expectedStatusCodes:
      - 405

assignees:
  - carloseorsantos

status-website:
  cname: status.heeey.click
  logoUrl: https://raw.githubusercontent.com/carloseorsantos/heeey.click/main/public/logo.svg
  favicon: https://raw.githubusercontent.com/carloseorsantos/heeey.click/main/public/favicon.svg
  name: heeey.click status
  introTitle: "**heeey.click** status"
  introMessage: Our servers and services are monitored automatically every 5 minutes. Outages and incidents appear here as they happen.
  navbar:
    - title: Status
      href: /
    - title: heeey.click
      href: https://www.heeey.click
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
